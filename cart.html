<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang</title>
  <link rel="stylesheet" href="css2/bootstrap.min.css">
      
  <style>
    body {
      background-color: #fff5f7;
    }
    .cart-card {
      border-radius: 15px;
      box-shadow: 0 6px 15px rgba(0,0,0,.1);
    }
  </style>

</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="#">Wedding Needs</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="produk.html">Produk</a></li>
          <li class="nav-item"><a class="nav-link" href="paket.html">Paket</a></li>
          <li class="nav-item"><a class="nav-link" href="best-seller.html">Best Seller</a></li>
          <li class="nav-item"><a class="nav-link" href="paket-promo.html">Paket Promo</a></li>
          <li class="nav-item"><a class="nav-link" href="galeri.html">Galeri</a></li>
          <li class="nav-item"><a class="nav-link" href="tentang.html">Tentang</a></li>
          <li class="nav-item"><a class="nav-link" href="kontak.html">Kontak</a></li>
          <li class="nav-item"><a class="nav-link" href="cart.html">🛒</a></li>
        </ul>
      </div>
    </div>
  </nav>

  
  <div id="cart-items" class="row g-3"></div>

  <div class="card mt-4 cart-card">
    <div class="card-body d-flex justify-content-between align-items-center">
      <h4 class="mb-0">
        Total: Rp <span id="total">0</span>
      </h4>
      <p>
         <a href="checkout.html" class="btn btn-primary w-100">Checkout</a> 
      </p>
    </div>
  </div>
  
</div>

<script>
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  const cartItems = document.getElementById('cart-items');
  const totalEl = document.getElementById('total');

  function renderCart() {
    cartItems.innerHTML = '';
    let total = 0;

    if (cart.length === 0) {
      cartItems.innerHTML = `
        <div class="col-12 text-center text-muted">
          <p>Keranjang masih kosong</p>
        </div>
      `;
      totalEl.textContent = 0;
      return;
    }

    cart.forEach((item, index) => {
      const subtotal = item.price * item.qty;
      total += subtotal;

      cartItems.innerHTML += `
        <div class="col-12">
          <div class="card cart-card">
            <div class="card-body">
              <h5 class="card-title">${item.name}</h5>
              <p class="mb-1">Harga: Rp ${item.price.toLocaleString()}</p>
              <p class="mb-1">Jumlah: ${item.qty}</p>
              <p class="fw-bold">Subtotal: Rp ${subtotal.toLocaleString()}</p>
              <button class="btn btn-danger btn-sm" onclick="removeItem(${index})">
                Hapus
              </button>
            </div>
          </div>
        </div>
      `;
    });

    totalEl.textContent = total.toLocaleString();
  }

  function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
  }

  function checkout() {
    if (cart.length === 0) {
      alert("Keranjang masih kosong");
      return;
    }
    alert("Checkout berhasil!");
    localStorage.removeItem('cart');
    renderCart();
  }

  renderCart();
</script>

<script src="js2/bootstrap.bundle.min.js"></script>
<script src="js/Cart.js"></script>
</body>
</html>
